<svg width="1000" height="560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="headGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dd6b20"/>
      <stop offset="100%" stop-color="#c05621"/>
    </linearGradient>
    <linearGradient id="catGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#319795"/>
      <stop offset="100%" stop-color="#285e61"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1000" height="560" fill="#f7fafc" rx="8"/>
  <rect x="15" y="15" width="970" height="530" fill="none" stroke="#e2e8f0" stroke-width="2" rx="6"/>

  <text x="30" y="45" font-size="18" font-weight="bold" fill="#2d3748">SƠ ĐỒ XƯƠNG CÁ: PHÂN TÍCH NGUYÊN NHÂN KHÁCH HÀNG BỎ DỞ ĐĂNG KÝ TÀI KHOẢN (S3)</text>
  <text x="30" y="68" font-size="13" fill="#718096">Chủ thể: Kênh Web/App ACFC Member | Trọng tâm: Tỷ lệ rớt đơn kỹ thuật số (Drop-off Rate ~28%)</text>

  <line x1="60" y1="290" x2="760" y2="290" stroke="#2d3748" stroke-width="5" stroke-linecap="round"/>
  <polygon points="760,278 790,290 760,302" fill="#2d3748"/>

  <rect x="790" y="235" width="180" height="110" rx="10" fill="url(#headGrad2)" filter="url(#shadow2)"/>
  <text x="880" y="270" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">VẤN ĐỀ CHÍNH:</text>
  <text x="880" y="295" font-size="13" font-weight="bold" fill="#feebc8" text-anchor="middle">TỶ LỆ BỎ DỞ ĐĂNG KÝ</text>
  <text x="880" y="315" font-size="12" fill="#ffffff" text-anchor="middle">CAO BẤT THƯỜNG</text>
  <text x="880" y="333" font-size="11" fill="#feebc8" text-anchor="middle">(Tỷ lệ bỏ dở ~28.0%)</text>

  <!-- 1. Người dùng (Customer) -->
  <line x1="180" y1="120" x2="280" y2="290" stroke="#319795" stroke-width="3"/>
  <rect x="100" y="90" width="160" height="35" rx="5" fill="url(#catGrad2)" filter="url(#shadow2)"/>
  <text x="180" y="113" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1. NGƯỜI DÙNG</text>

  <line x1="120" y1="160" x2="205" y2="160" stroke="#4a5568" stroke-width="1.5"/>
  <text x="115" y="155" font-size="11" fill="#2d3748" text-anchor="end">Quên mật khẩu cũ, tưởng chưa có nick</text>

  <line x1="150" y1="205" x2="230" y2="205" stroke="#4a5568" stroke-width="1.5"/>
  <text x="145" y="200" font-size="11" fill="#2d3748" text-anchor="end">Sợ lộ dữ liệu cá nhân (CCCD, địa chỉ)</text>

  <line x1="180" y1="250" x2="255" y2="250" stroke="#4a5568" stroke-width="1.5"/>
  <text x="175" y="245" font-size="11" fill="#2d3748" text-anchor="end">Nhập sai OTP vội vàng quá 3 lần</text>

  <!-- 2. Quy trình & Luồng thao tác (Method) -->
  <line x1="480" y1="120" x2="580" y2="290" stroke="#319795" stroke-width="3"/>
  <rect x="390" y="90" width="180" height="35" rx="5" fill="url(#catGrad2)" filter="url(#shadow2)"/>
  <text x="480" y="113" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2. THIẾT KẾ QUY TRÌNH</text>

  <line x1="410" y1="160" x2="505" y2="160" stroke="#4a5568" stroke-width="1.5"/>
  <text x="405" y="155" font-size="11" fill="#2d3748" text-anchor="end">Bắt buộc điền nhiều trường cùng lúc</text>

  <line x1="440" y1="205" x2="530" y2="205" stroke="#4a5568" stroke-width="1.5"/>
  <text x="435" y="200" font-size="11" fill="#2d3748" text-anchor="end">Chưa hỗ trợ Social Login 1 chạm</text>

  <line x1="470" y1="250" x2="555" y2="250" stroke="#4a5568" stroke-width="1.5"/>
  <text x="465" y="245" font-size="11" fill="#2d3748" text-anchor="end">Quy trình khôi phục mật khẩu chậm</text>

  <!-- 3. Công nghệ & Hạ tầng (Machine) -->
  <line x1="280" y1="290" x2="180" y2="460" stroke="#319795" stroke-width="3"/>
  <rect x="90" y="460" width="180" height="35" rx="5" fill="url(#catGrad2)" filter="url(#shadow2)"/>
  <text x="180" y="483" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3. HẠ TẦNG CÔNG NGHỆ</text>

  <line x1="130" y1="350" x2="245" y2="350" stroke="#4a5568" stroke-width="1.5"/>
  <text x="125" y="345" font-size="11" fill="#2d3748" text-anchor="end">Nghẽn mạng viễn thông trễ SMS >60s</text>

  <line x1="160" y1="400" x2="215" y2="400" stroke="#4a5568" stroke-width="1.5"/>
  <text x="155" y="395" font-size="11" fill="#2d3748" text-anchor="end">Chưa có kênh OTP qua Zalo ZNS</text>

  <!-- 4. Giao diện (UI/UX) -->
  <line x1="580" y1="290" x2="480" y2="460" stroke="#319795" stroke-width="3"/>
  <rect x="400" y="460" width="160" height="35" rx="5" fill="url(#catGrad2)" filter="url(#shadow2)"/>
  <text x="480" y="483" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4. GIAO DIỆN (UI/UX)</text>

  <line x1="420" y1="350" x2="545" y2="350" stroke="#4a5568" stroke-width="1.5"/>
  <text x="415" y="345" font-size="11" fill="#2d3748" text-anchor="end">Thiếu Auto-fill OTP từ SMS</text>

  <line x1="450" y1="400" x2="515" y2="400" stroke="#4a5568" stroke-width="1.5"/>
  <text x="445" y="395" font-size="11" fill="#2d3748" text-anchor="end">Cảnh báo lỗi định dạng không rõ</text>

  <text x="500" y="525" font-size="12" font-style="italic" fill="#718096" text-anchor="middle">Hình 5.1: Sơ đồ xương cá phân tích nguyên nhân khách hàng bỏ dở kích hoạt tài khoản thành viên.</text>
</svg>