<svg width="1000" height="560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c53030"/>
      <stop offset="100%" stop-color="#9b2c2c"/>
    </linearGradient>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b6cb0"/>
      <stop offset="100%" stop-color="#2c5282"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#f7fafc" rx="8"/>
  <rect x="15" y="15" width="970" height="530" fill="none" stroke="#e2e8f0" stroke-width="2" rx="6"/>

  <!-- Title -->
  <text x="30" y="45" font-size="18" font-weight="bold" fill="#2d3748">SƠ ĐỒ XƯƠNG CÁ (FISHBONE): PHÂN TÍCH NGUYÊN NHÂN SAI LỆCH TỒN KHO (S2)</text>
  <text x="30" y="68" font-size="13" fill="#718096">Chủ thể: Hệ thống Tổng kho &amp; Chuỗi Cửa hàng Bán lẻ ACFC | Phương pháp: 5M (Man, Method, Machine, Material, Measurement)</text>

  <!-- Main Spine -->
  <line x1="60" y1="290" x2="760" y2="290" stroke="#2d3748" stroke-width="5" stroke-linecap="round"/>
  <polygon points="760,278 790,290 760,302" fill="#2d3748"/>

  <!-- Problem Fish Head -->
  <rect x="790" y="235" width="180" height="110" rx="10" fill="url(#headGrad)" filter="url(#shadow)"/>
  <text x="880" y="270" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">VẤN ĐỀ CHÍNH:</text>
  <text x="880" y="295" font-size="13" font-weight="bold" fill="#feebc8" text-anchor="middle">SAI LỆCH TỒN KHO</text>
  <text x="880" y="315" font-size="12" fill="#ffffff" text-anchor="middle">THỰC TẾ &amp; SỔ SÁCH</text>
  <text x="880" y="333" font-size="11" fill="#fed7d7" text-anchor="middle">(Tỷ lệ lệch ban đầu 3.0%)</text>

  <!-- Upper Bones (3 categories) -->
  <!-- 1. Con người (Man) -->
  <line x1="160" y1="120" x2="260" y2="290" stroke="#2b6cb0" stroke-width="3"/>
  <rect x="90" y="90" width="140" height="35" rx="5" fill="url(#catGrad)" filter="url(#shadow)"/>
  <text x="160" y="113" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1. CON NGƯỜI (MAN)</text>

  <line x1="110" y1="160" x2="185" y2="160" stroke="#4a5568" stroke-width="1.5"/>
  <text x="105" y="155" font-size="11" fill="#2d3748" text-anchor="end">Thu ngân quét nhầm mã size/màu</text>

  <line x1="130" y1="205" x2="210" y2="205" stroke="#4a5568" stroke-width="1.5"/>
  <text x="125" y="200" font-size="11" fill="#2d3748" text-anchor="end">Nhân viên kho nhập hàng vội, bỏ đếm</text>

  <line x1="160" y1="250" x2="235" y2="250" stroke="#4a5568" stroke-width="1.5"/>
  <text x="155" y="245" font-size="11" fill="#2d3748" text-anchor="end">Ý thức tuân thủ kém, gian lận nội bộ</text>

  <!-- 2. Quy trình (Method) -->
  <line x1="380" y1="120" x2="480" y2="290" stroke="#2b6cb0" stroke-width="3"/>
  <rect x="300" y="90" width="160" height="35" rx="5" fill="url(#catGrad)" filter="url(#shadow)"/>
  <text x="380" y="113" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2. QUY TRÌNH (METHOD)</text>

  <line x1="320" y1="160" x2="405" y2="160" stroke="#4a5568" stroke-width="1.5"/>
  <text x="315" y="155" font-size="11" fill="#2d3748" text-anchor="end">Chưa có kiểm kê cuốn chiếu hàng ngày</text>

  <line x1="350" y1="205" x2="430" y2="205" stroke="#4a5568" stroke-width="1.5"/>
  <text x="345" y="200" font-size="11" fill="#2d3748" text-anchor="end">Đổi trả online chưa hoàn kho ngay</text>

  <line x1="380" y1="250" x2="455" y2="250" stroke="#4a5568" stroke-width="1.5"/>
  <text x="375" y="245" font-size="11" fill="#2d3748" text-anchor="end">Hàng lỗi lưu chung khu hàng bán</text>

  <!-- 3. Công nghệ (Machine) -->
  <line x1="600" y1="120" x2="700" y2="290" stroke="#2b6cb0" stroke-width="3"/>
  <rect x="520" y="90" width="170" height="35" rx="5" fill="url(#catGrad)" filter="url(#shadow)"/>
  <text x="605" y="113" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3. CÔNG NGHỆ (MACHINE)</text>

  <line x1="540" y1="160" x2="625" y2="160" stroke="#4a5568" stroke-width="1.5"/>
  <text x="535" y="155" font-size="11" fill="#2d3748" text-anchor="end">Máy quét Barcode quang học mờ</text>

  <line x1="570" y1="205" x2="650" y2="205" stroke="#4a5568" stroke-width="1.5"/>
  <text x="565" y="200" font-size="11" fill="#2d3748" text-anchor="end">Đồng bộ POS - WMS có độ trễ</text>

  <line x1="600" y1="250" x2="675" y2="250" stroke="#4a5568" stroke-width="1.5"/>
  <text x="595" y="245" font-size="11" fill="#2d3748" text-anchor="end">Chưa áp dụng chip RFID hàng loạt</text>

  <!-- Lower Bones (2 categories) -->
  <!-- 4. Sản phẩm & Tem nhãn (Material) -->
  <line x1="260" y1="290" x2="160" y2="460" stroke="#2b6cb0" stroke-width="3"/>
  <rect x="70" y="460" width="180" height="35" rx="5" fill="url(#catGrad)" filter="url(#shadow)"/>
  <text x="160" y="483" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4. SẢN PHẨM (MATERIAL)</text>

  <line x1="120" y1="340" x2="230" y2="340" stroke="#4a5568" stroke-width="1.5"/>
  <text x="115" y="335" font-size="11" fill="#2d3748" text-anchor="end">Tem nhãn mã vạch bị rách, mờ nhiệt</text>

  <line x1="140" y1="385" x2="205" y2="385" stroke="#4a5568" stroke-width="1.5"/>
  <text x="135" y="380" font-size="11" fill="#2d3748" text-anchor="end">Hộp sản phẩm bị tráo ruột khác size</text>

  <line x1="160" y1="430" x2="180" y2="430" stroke="#4a5568" stroke-width="1.5"/>
  <text x="155" y="425" font-size="11" fill="#2d3748" text-anchor="end">Nhiều SKU thời trang cùng màu sắc</text>

  <!-- 5. Đo lường & Môi trường (Measurement) -->
  <line x1="500" y1="290" x2="400" y2="460" stroke="#2b6cb0" stroke-width="3"/>
  <rect x="300" y="460" width="200" height="35" rx="5" fill="url(#catGrad)" filter="url(#shadow)"/>
  <text x="400" y="483" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5. ĐO LƯỜNG (MEASUREMENT)</text>

  <line x1="350" y1="350" x2="465" y2="350" stroke="#4a5568" stroke-width="1.5"/>
  <text x="345" y="345" font-size="11" fill="#2d3748" text-anchor="end">Ngưỡng sai số cho phép chưa rõ</text>

  <line x1="380" y1="400" x2="435" y2="400" stroke="#4a5568" stroke-width="1.5"/>
  <text x="375" y="395" font-size="11" fill="#2d3748" text-anchor="end">Thời gian khóa sổ kéo dài làm sai số</text>

  <!-- Footer caption -->
  <text x="500" y="525" font-size="12" font-style="italic" fill="#718096" text-anchor="middle">Hình 4.1: Sơ đồ xương cá phân tích nguyên nhân gốc rễ dẫn đến sai lệch tồn kho tại ACFC.</text>
</svg>