  <text x="750" y="770" font-size="12" font-style="italic" fill="#718096" text-anchor="middle">Hình 3.1: Sơ đồ BPMN 2.0 quy trình Hoạch định hàng hóa và Phân bổ nguồn hàng theo mùa (M3).</text>
