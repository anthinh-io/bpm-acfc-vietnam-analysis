<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#ffffff"/>
  <style>
    text { font-family: "Times New Roman", serif; fill: #111111; }
    .title { font-size: 28px; font-weight: 700; }
    .axis { font-size: 18px; }
    .label { font-size: 17px; }
    .value { font-size: 18px; font-weight: 700; }
    .grid { stroke: #d9d9d9; stroke-width: 1; }
  </style>

  <text x="600" y="44" text-anchor="middle" class="title">Pareto tác động cycle time ước tính của các vấn đề</text>
  <text x="600" y="72" text-anchor="middle" class="axis">Kịch bản điển hình, đơn vị: giờ theo lịch trên mỗi hồ sơ</text>

  <line x1="105" y1="100" x2="105" y2="580" stroke="#333333" stroke-width="2"/>
  <line x1="105" y1="580" x2="1095" y2="580" stroke="#333333" stroke-width="2"/>
  <line x1="1095" y1="100" x2="1095" y2="580" stroke="#333333" stroke-width="2"/>

  <g class="grid">
    <line x1="105" y1="580" x2="1095" y2="580"/>
    <line x1="105" y1="484" x2="1095" y2="484"/>
    <line x1="105" y1="388" x2="1095" y2="388"/>
    <line x1="105" y1="292" x2="1095" y2="292"/>
    <line x1="105" y1="196" x2="1095" y2="196" stroke="#9e9e9e" stroke-dasharray="8 6"/>
    <line x1="105" y1="100" x2="1095" y2="100"/>
  </g>

  <g class="axis" text-anchor="end">
    <text x="92" y="586">0</text>
    <text x="92" y="490">80</text>
    <text x="92" y="394">160</text>
    <text x="92" y="298">240</text>
    <text x="92" y="202">320</text>
    <text x="92" y="106">400</text>
  </g>
  <g class="axis" text-anchor="start">
    <text x="1108" y="586">0%</text>
    <text x="1108" y="490">20%</text>
    <text x="1108" y="394">40%</text>
    <text x="1108" y="298">60%</text>
    <text x="1108" y="202">80%</text>
    <text x="1108" y="106">100%</text>
  </g>

  <text x="28" y="340" class="axis" text-anchor="middle" transform="rotate(-90 28 340)">Tác động cycle time ước tính</text>
  <text x="1170" y="340" class="axis" text-anchor="middle" transform="rotate(90 1170 340)">Tỷ lệ tích lũy</text>

  <g fill="#4472c4">
    <rect x="125" y="205.6" width="110" height="374.4"/>
    <rect x="325" y="403.36" width="110" height="176.64"/>
    <rect x="525" y="436" width="110" height="144"/>
    <rect x="725" y="512.8" width="110" height="67.2"/>
    <rect x="925" y="541.6" width="110" height="38.4"/>
  </g>
  <g class="value" text-anchor="middle">
    <text x="180" y="195">312</text>
    <text x="380" y="393">147,2</text>
    <text x="580" y="426">120</text>
    <text x="780" y="502">56</text>
    <text x="980" y="531">32</text>
  </g>

  <polyline points="180,355.4 380,249.8 580,163.4 780,123.0 980,100" fill="none" stroke="#ed7d31" stroke-width="5"/>
  <g fill="#ed7d31" stroke="#ffffff" stroke-width="2">
    <circle cx="180" cy="355.4" r="7"/>
    <circle cx="380" cy="249.8" r="7"/>
    <circle cx="580" cy="163.4" r="7"/>
    <circle cx="780" cy="123.0" r="7"/>
    <circle cx="980" cy="100" r="7"/>
  </g>
  <g class="value" fill="#c65911" text-anchor="middle">
    <text x="180" y="342">46,8%</text>
    <text x="380" y="236">68,8%</text>
    <text x="580" y="150">86,8%</text>
    <text x="780" y="110">95,2%</text>
    <text x="980" y="88">100%</text>
  </g>

  <g class="label" text-anchor="middle">
    <text x="180" y="610"><tspan x="180">Chờ kế hoạch</tspan><tspan x="180" dy="22">và báo giá</tspan></text>
    <text x="380" y="610"><tspan x="380">Sửa và</tspan><tspan x="380" dy="22">phê duyệt lại</tspan></text>
    <text x="580" y="610"><tspan x="580">Phản hồi</tspan><tspan x="580" dy="22">Tài chính</tspan></text>
    <text x="780" y="610"><tspan x="780">Xem xét và</tspan><tspan x="780" dy="22">xác nhận điều kiện</tspan></text>
    <text x="980" y="610"><tspan x="980">Tiếp nhận và</tspan><tspan x="980" dy="22">lập đề xuất</tspan></text>
  </g>

  <rect x="395" y="674" width="24" height="15" fill="#4472c4"/>
  <text x="427" y="688" class="label">Tác động cycle time ước tính</text>
  <line x1="650" y1="681" x2="690" y2="681" stroke="#ed7d31" stroke-width="5"/>
  <circle cx="670" cy="681" r="6" fill="#ed7d31"/>
  <text x="700" y="688" class="label">Tỷ lệ tích lũy</text>
</svg>
