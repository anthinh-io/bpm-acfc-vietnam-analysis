  <text x="40" y="40" font-size="19" font-weight="bold" fill="#1a202c">SƠ ĐỒ BPMN 2.0: THU HỒI &amp; XỬ LÝ HÀNG TRẢ VỀ / HÀNG LỖI (K3) – ACFC</text>
  <text x="40" y="64" font-size="12.5" fill="#718096">1 Pool (DC) – 4 Lane. 9 cổng: G1,G2,G3,G4,G4b,G5,Gm (XOR) + Ga/Gj (AND split–join). Nhận hàng trả từ K2/cửa hàng; message hao hụt/tồn về S3/M3 và đề nghị hoàn tiền sang C4.</text>
