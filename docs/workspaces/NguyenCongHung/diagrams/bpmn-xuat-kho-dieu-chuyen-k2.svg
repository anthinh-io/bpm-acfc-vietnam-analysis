  <text x="40" y="40" font-size="19" font-weight="bold" fill="#1a202c">SƠ ĐỒ BPMN 2.0: XUẤT KHO &amp; ĐIỀU CHUYỂN PHÂN BỔ TỚI CHUỖI CỬA HÀNG (K2) – ACFC</text>
  <text x="40" y="64" font-size="12.5" fill="#718096">1 Pool (DC) – 4 Lane. 9 cổng: G1,G1b,G2,G3,G4,Gm1,Gm2 (XOR) + Ga/Gj (AND split–join). Nối tiếp đầu ra M3; message hàng lỗi sang K3 và cập nhật tồn cửa hàng về S3/M3.</text>
  <rect x="40" y="90" width="2740" height="840" fill="#ffffff" stroke="#2d3748" stroke-width="2"/><rect x="40" y="90" width="34" height="840" fill="#3182ce"/><text x="57" y="510" font-size="12" font-weight="bold" fill="#ffffff" transform="rotate(-90 57 510)" text-anchor="middle">ACFC – TRUNG TÂM PHÂN PHỐI (DC): XUẤT KHO &amp; ĐIỀU CHUYỂN TỚI CHUỖI CỬA HÀNG (K2)</text>
