  <text x="40" y="40" font-size="19" font-weight="bold" fill="#1a202c">SƠ ĐỒ BPMN 2.0: NHẬN HÀNG, KIỂM TRA CHẤT LƯỢNG &amp; NHẬP KHO TỪ CHỦ THƯƠNG HIỆU (K1) – ACFC</text>
  <text x="40" y="64" font-size="12.5" fill="#718096">1 Pool (DC) – 4 Lane. 9 cổng: G1,G2,Gm,G3,G4,Gm3 (XOR) + Ga/Gj (AND split–join) + G5. Nhiều End; message flow cấp tồn đầu vào cho S3/M3 và cross-dock sang K2.</text>
