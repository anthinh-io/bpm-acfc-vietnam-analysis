<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Pareto tần suất các vấn đề S1 - Đổi hàng, bảo hành và khiếu nại</title>
  <desc id="desc">Biểu đồ gồm sáu cột tần suất giảm dần, đường tỷ lệ tích lũy và ngưỡng 80 phần trăm.</desc>
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <text x="600" y="43" fill="#172033" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Pareto tần suất các vấn đề – S1: Đổi hàng, bảo hành và khiếu nại</text>
  <g stroke="#DFE6EF" stroke-width="1.2">
    <line x1="110" y1="560" x2="1050" y2="560"/><line x1="110" y1="483.3" x2="1050" y2="483.3"/>
    <line x1="110" y1="406.7" x2="1050" y2="406.7"/><line x1="110" y1="330" x2="1050" y2="330"/>
    <line x1="110" y1="253.3" x2="1050" y2="253.3"/><line x1="110" y1="176.7" x2="1050" y2="176.7"/>
    <line x1="110" y1="100" x2="1050" y2="100"/>
  </g>
  <g stroke="#7285A1" stroke-width="1.5">
    <line x1="110" y1="100" x2="110" y2="560"/><line x1="1050" y1="100" x2="1050" y2="560"/><line x1="110" y1="560" x2="1050" y2="560"/>
  </g>
  <g fill="#52627A" font-family="Arial, sans-serif" font-size="13" text-anchor="end">
    <text x="98" y="565">0</text><text x="98" y="488">5</text><text x="98" y="411">10</text><text x="98" y="335">15</text>
    <text x="98" y="258">20</text><text x="98" y="181">25</text><text x="98" y="105">30</text>
  </g>
  <g fill="#52627A" font-family="Arial, sans-serif" font-size="13">
    <text x="1064" y="565">0%</text><text x="1064" y="473">20%</text><text x="1064" y="381">40%</text>
    <text x="1064" y="289">60%</text><text x="1064" y="197">80%</text><text x="1064" y="105">100%</text>
  </g>
  <text x="30" y="330" transform="rotate(-90 30 330)" fill="#52627A" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Số lần phát sinh</text>
  <text x="1172" y="330" transform="rotate(90 1172 330)" fill="#52627A" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Tỷ lệ tích lũy</text>
  <line x1="110" y1="192" x2="1050" y2="192" stroke="#E13D3D" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="1038" y="183" fill="#172033" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end">Ngưỡng 80%</text>
  <g fill="#5589C5">
    <rect x="134" y="130.7" width="112" height="429.3" rx="3"/><rect x="294" y="207.3" width="112" height="352.7" rx="3"/>
    <rect x="454" y="284" width="112" height="276" rx="3"/><rect x="614" y="360.7" width="112" height="199.3" rx="3"/>
    <rect x="774" y="406.7" width="112" height="153.3" rx="3"/><rect x="934" y="437.3" width="112" height="122.7" rx="3"/>
  </g>
  <g fill="#123C70" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <text x="190" y="119">28</text><text x="350" y="196">23</text><text x="510" y="273">18</text>
    <text x="670" y="349">13</text><text x="830" y="395">10</text><text x="990" y="426">8</text>
  </g>
  <polyline points="190,431.2 350,325.4 510,242.6 670,182.8 830,136.8 990,100" fill="none" stroke="#D66527" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FFFFFF" stroke="#D66527" stroke-width="4">
    <circle cx="190" cy="431.2" r="7"/><circle cx="350" cy="325.4" r="7"/><circle cx="510" cy="242.6" r="7"/>
    <circle cx="670" cy="182.8" r="7"/><circle cx="830" cy="136.8" r="7"/><circle cx="990" cy="100" r="7"/>
  </g>
  <g fill="#C35316" font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <text x="204" y="420">28%</text><text x="364" y="314">51%</text><text x="524" y="231">69%</text>
    <text x="684" y="171">82%</text><text x="844" y="125">92%</text><text x="1004" y="90">100%</text>
  </g>
  <g fill="#172033" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">
    <text x="190" y="590"><tspan x="190">Thiếu hồ sơ/</tspan><tspan x="190" dy="19">bằng chứng</tspan></text>
    <text x="350" y="590"><tspan x="350">Chờ duyệt ngoại lệ/</tspan><tspan x="350" dy="19">chuyển cấp</tspan></text>
    <text x="510" y="590"><tspan x="510">Chờ kiểm tra</tspan><tspan x="510" dy="19">sản phẩm</tspan></text>
    <text x="670" y="590"><tspan x="670">Thiếu sản phẩm</tspan><tspan x="670" dy="19">thay thế</tspan></text>
    <text x="830" y="590"><tspan x="830">Cung cấp lại</tspan><tspan x="830" dy="19">thông tin</tspan></text>
    <text x="990" y="590"><tspan x="990">Nhập/kiểm tra</tspan><tspan x="990" dy="19">lặp lại</tspan></text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#52627A">
    <rect x="294" y="656" width="24" height="14" rx="2" fill="#5589C5"/><text x="330" y="668">Số lần phát sinh</text>
    <line x1="492" y1="663" x2="526" y2="663" stroke="#D66527" stroke-width="3"/><circle cx="509" cy="663" r="6" fill="#FFFFFF" stroke="#D66527" stroke-width="3"/><text x="538" y="668">Tỷ lệ tích lũy</text>
    <line x1="706" y1="663" x2="740" y2="663" stroke="#E13D3D" stroke-width="2" stroke-dasharray="7 6"/><text x="752" y="668">Ngưỡng 80%</text>
  </g>
